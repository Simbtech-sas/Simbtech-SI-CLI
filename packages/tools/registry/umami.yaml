id: umami
name: Umami
category: observability
summary: Privacy-first web analytics, no cookies, GDPR-friendly
repo: https://github.com/umami-software/umami
license: MIT
flavors: [sisaas, sical, platform]

env:
  - key: UMAMI_URL
    value: "http://localhost:3030"
  - key: UMAMI_WEBSITE_ID

compose: compose.yml

deploy:
  image: ghcr.io/umami-software/umami:postgresql-v2.20.2
  port: 3000
  needsDatabase: true
  ingress: true
  env:
    DATABASE_TYPE: postgresql
    DATABASE_URL: "postgresql://{{db.username}}:{{db.password}}@{{db.host}}:5432/{{db.name}}"

notes:
  - "SiCAL note: Umami is a network call. Do not add it to a no-network build."
