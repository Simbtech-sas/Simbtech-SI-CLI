services:
  # LiveKit — WebRTC SFU. Dev mode uses a static API key/secret pair; generate
  # real ones with `livekit-server generate-keys` before deploying.
  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_at_least_32_characters_long}"
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'
