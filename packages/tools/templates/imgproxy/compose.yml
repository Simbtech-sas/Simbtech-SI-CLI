services:
  imgproxy:
    image: darthsim/imgproxy:v3.30
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: {{brand}}
      AWS_SECRET_ACCESS_KEY: {{brand}}_dev_pwd
    ports:
      - '${IMGPROXY_HOST_PORT:-8082}:8080'
