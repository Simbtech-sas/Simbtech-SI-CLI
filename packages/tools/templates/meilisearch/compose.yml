services:
  meilisearch:
    image: getmeili/meilisearch:v1.24
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_master_key}
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

volumes:
  meili-data:
