services:
  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped
    depends_on:
      - temporal-postgres
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_dev_pwd
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - '${TEMPORAL_HOST_PORT:-7233}:7233'

  temporal-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_dev_pwd
    volumes:
      - temporal-data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:2.53.3
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '${TEMPORAL_UI_HOST_PORT:-8233}:8080'

volumes:
  temporal-data:
