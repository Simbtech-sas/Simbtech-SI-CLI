id: forgot-password
kind: feature
name: Forgot password
category: auth
summary: Password reset by emailed single-use token, with the enumeration traps closed
repo: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
license: UNLICENSED
flavors: [sisaas]
requires: [notifications-email]

migrations:
  - src: migration.sql.hbs
    name: password_reset

files:
  - src: reset.service.ts.hbs
    dest: src/modules/iam/application/password-reset.service.ts
  - src: reset.controller.ts.hbs
    dest: src/modules/iam/interface/password-reset.controller.ts
  - src: schema.ts.hbs
    dest: src/database/schema/password-reset.ts

register:
  - anchor: schema
    snippet: "export * from './password-reset';"
  - anchor: controllers
    snippet: PasswordResetController,
    import: "import { PasswordResetController } from './interface/password-reset.controller';"
  # A controller without its service is a module that compiles and cannot boot.
  - anchor: iamProviders
    snippet: PasswordResetService,
    import: "import { PasswordResetService } from './application/password-reset.service';"

notes:
  - "The request endpoint ALWAYS returns 200, whether or not the address exists — anything else is an account-enumeration oracle."
  - "Tokens are stored hashed, single-use, and expire in 1 hour. A reset revokes every refresh-token family: if the password changed, existing sessions should not survive."
  - "Only for the built-in auth. With Keycloak or ZITADEL the provider owns password reset."
