id: n8n
name: n8n
category: ai
summary: Workflow automation — connect the app to hundreds of third-party services without writing integrations
repo: https://github.com/n8n-io/n8n
license: Sustainable-Use
flavors: [sisaas, platform]

env:
  - key: N8N_URL
    value: "http://localhost:5678"
  - key: N8N_WEBHOOK_SECRET
    comment: Shared secret for inbound webhooks

compose: compose.yml

deploy:
  image: n8nio/n8n:2.37.4
  port: 5678
  needsDatabase: true
  ingress: true
  storage: 5Gi

notes:
  - "Sustainable Use Licence: fine internally, restricted if you resell n8n itself as a hosted product."
  - "Emits webhooks. Bridge them onto the event bus with `si add integrations` and enable a `n8n` source in `webhook-sources.ts` — then react to it like any other Kafka event, instead of writing a bespoke listener."
