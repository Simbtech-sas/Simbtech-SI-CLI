services:
  unleash:
    image: unleashorg/unleash-server:6.9
    restart: unless-stopped
    depends_on:
      - unleash-postgres
    environment:
      DATABASE_URL: postgres://unleash:unleash_dev_pwd@unleash-postgres:5432/unleash
      DATABASE_SSL: 'false'
    ports:
      - '${UNLEASH_HOST_PORT:-4242}:4242'

  unleash-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash_dev_pwd
      POSTGRES_DB: unleash
    volumes:
      - unleash-data:/var/lib/postgresql/data

volumes:
  unleash-data:
