name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Every flavor must scaffold and rebrand cleanly. Cheap, and it catches a
      # template broken by an edit that never touched TypeScript.
      - run: ./scripts/smoke.sh
